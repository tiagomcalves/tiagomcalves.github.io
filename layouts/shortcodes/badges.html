{{ $names := split (.Get "text") ";" }}
{{ $bgcolor := .Get "bgcolor" | default "#dcfce7" }}

<div style="
  display: inline-flex;
  flex-wrap: wrap;
  gap: 3px;
  margin: 0;
  padding: 0;
  vertical-align: middle;
  line-height: 1;
">
  {{ range $names }}
    <span style="
      display: inline-flex;
      align-items: center;
      padding: 1px 8px;
      line-height: 1;
      font-size: 14px;
      font-weight: bold;
      background-color: {{ $bgcolor }};
      color: FloralWhite;
      border: 1px solid black;
      border-radius: 10px;
    ">
      {{ . | strings.TrimSpace }}
    </span>
  {{ end }}
</div>
